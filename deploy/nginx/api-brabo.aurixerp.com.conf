# API Brabo → https://api-brabo.aurixerp.com → 127.0.0.1:8088
# Instalación:
#   sudo cp deploy/nginx/api-brabo.aurixerp.com.conf /etc/nginx/sites-available/
#   sudo ln -sfn /etc/nginx/sites-available/api-brabo.aurixerp.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api-brabo.aurixerp.com
#
# DNS: registro A api-brabo.aurixerp.com → IP del VPS
# No usar 8086 (MF) ni 8087 (HGroup).

server {
    listen 80;
    listen [::]:80;
    server_name api-brabo.aurixerp.com;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin $http_origin;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    location /health {
        proxy_pass http://127.0.0.1:8088/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
