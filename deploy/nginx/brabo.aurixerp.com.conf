# Front Brabo → https://brabo.aurixerp.com
# Next.js en el VPS: `next start -H 127.0.0.1 -p 3088` (PORT front típico 3088).
# Si el front aún no está en el VPS, este site queda listo; el proxy fallará hasta que exista el proceso.
#
#   sudo cp deploy/nginx/brabo.aurixerp.com.conf /etc/nginx/sites-available/
#   sudo ln -sfn /etc/nginx/sites-available/brabo.aurixerp.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d brabo.aurixerp.com
#
# DNS: A brabo.aurixerp.com → IP del VPS
# Env front (build): NEXT_PUBLIC_API_URL=https://api-brabo.aurixerp.com/api/

upstream brabo_next {
    server 127.0.0.1:3088;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name brabo.aurixerp.com;

    client_max_body_size 20M;

    location / {
        proxy_pass http://brabo_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
