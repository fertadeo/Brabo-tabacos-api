# Redirección HTTP a HTTPS
server {
    listen 80;
    server_name api.sistema.brabo-tabacos.com.ar;
    
    # Redirigir todo el tráfico HTTP a HTTPS
    return 301 https://$server_name$request_uri;
}

# Configuración HTTPS
server {
    listen 443 ssl http2;
    server_name api.sistema.brabo-tabacos.com.ar; # Dominio de la API

    # Logs
    access_log /var/log/nginx/brabo-tabacos-api-access.log;
    error_log /var/log/nginx/brabo-tabacos-api-error.log;
    
    # Configuración SSL/TLS
    ssl_certificate /etc/letsencrypt/live/api.sistema.brabo-tabacos.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.sistema.brabo-tabacos.com.ar/privkey.pem;
    
    # Configuración SSL moderna y segura
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    
    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/api.sistema.brabo-tabacos.com.ar/chain.pem;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # Configuración de límites
    client_max_body_size 10M;
    client_body_timeout 60s;
    client_header_timeout 60s;

    # Proxy a la aplicación Node.js
    location / {
        proxy_pass http://localhost:8087;
        proxy_http_version 1.1;
        
        # Headers para mantener información del cliente original
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # ⚠️ IMPORTANTE: Pasar el header Origin para CORS
        proxy_set_header Origin $http_origin;
        
        # Pasar headers de CORS preflight
        proxy_set_header Access-Control-Request-Method $request_method;
        proxy_set_header Access-Control-Request-Headers $http_access_control_request_headers;

        # Timeouts (aumentados para operaciones que requieren más tiempo como bcrypt)
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Buffering
        proxy_buffering off;
        proxy_request_buffering off;
        
        # ⚠️ IMPORTANTE: No agregar headers de seguridad aquí, dejar que Node.js maneje CORS
        # Los headers de seguridad se agregan más abajo pero solo si no son requests OPTIONS
    }

    # Health check endpoint
    location /health {
        proxy_pass http://localhost:8087/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # Configuración de seguridad
    # Nota: Los headers de seguridad los maneja Node.js (helmet)
    # No los agregamos aquí para evitar conflictos con CORS preflight (OPTIONS)
    # Si necesitas agregar headers de seguridad, hazlo en Node.js
    
    # Headers de seguridad adicionales para HTTPS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}

